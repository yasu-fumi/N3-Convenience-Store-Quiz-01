<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>まいにちマート レジ・チャレンジ</title>
<meta name="description" content="N3コンビニ日本語クイズ全10問。コンビニのレジで店員の日本語を聞き取ろう。">
<style>
:root{
  --ink:#24303a; --sub:#66737d; --line:#e2e6ea; --bg:#f3efe7; --card:#ffffff;
  --main:#14907a; --main-d:#0e6e5d; --main-l:#e3f4ef; --accent:#ff8a3d; --accent-d:#e06a1c;
  --ok:#22b07d; --ng:#ef5350; --gold:#ffc83d;
  --A:#ef5d6c; --B:#3d8bfd; --C:#22b07d; --D:#f5a524;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{ background:#2a3138; color:var(--ink); overflow:hidden;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  display:flex; align-items:center; justify-content:center; }
[lang="zh-CN"]{ font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif; }
[lang="ne"]{ font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",sans-serif; }
button{ font:inherit; color:inherit; border:none; background:none; cursor:pointer; }
ruby rt{ font-size:.48em; font-weight:500; opacity:.75; }
body.nofuri rt{ display:none; }

/* ====== レイアウト ====== */
#app{ position:relative; width:100%; height:100%; max-width:760px; background:var(--bg);
  display:grid; grid-template-rows:auto minmax(190px,44%) 1fr; overflow:hidden; }
@media (min-width:760px){ #app{ height:min(100%,980px); border-radius:18px; box-shadow:0 20px 60px #0006; } }
@media (orientation:landscape) and (min-width:640px){
  #app{ max-width:1320px; height:min(100%,860px); grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr); grid-template-rows:auto 1fr; }
  header{ grid-column:1 / -1; }
  #scene{ grid-row:2; grid-column:1; }
  #app #panel{ grid-row:2; grid-column:2; position:relative; }
  .fb{ max-height:calc(100% - 16px) !important; }
  .choices{ grid-template-columns:1fr !important; }
}

/* ====== ヘッダー ====== */
header{ display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--main); color:#fff; min-height:48px; z-index:25; }
.brand{ font-weight:900; font-size:clamp(14px,1.2vw + 9px,18px); letter-spacing:.04em; white-space:nowrap; }
.brand small{ display:block; font-size:10px; font-weight:700; opacity:.8; letter-spacing:0; }
.dots{ display:flex; gap:4px; margin-left:auto; }
.dots i{ width:clamp(7px,1.6vw,11px); height:clamp(7px,1.6vw,11px); border-radius:50%; background:#ffffff44; transition:.3s; }
.dots i.cur{ background:#fff; transform:scale(1.35); }
.dots i.ok{ background:var(--gold); }
.dots i.ng{ background:#ff9a9a; }
.score{ font-weight:900; font-size:clamp(16px,1.4vw + 10px,22px); font-variant-numeric:tabular-nums; min-width:64px; text-align:right; }
.score small{ display:block; font-size:9px; opacity:.8; font-weight:700; text-align:right; }
.hbtn{ width:34px; height:34px; border-radius:10px; background:#ffffff26; font-size:15px; font-weight:800; flex:none; }
.hbtn[aria-pressed="false"]{ opacity:.45; }

/* ====== シーン ====== */
#scene{ position:relative; overflow:hidden; background:#fdfcf8; }
#scene > svg.stage{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.bubble{ position:absolute; left:3%; right:3%; top:3%; z-index:3; background:#fff; border:3px solid var(--ink); border-radius:18px;
  padding:clamp(6px,1.2vh,12px) 46px clamp(6px,1.2vh,12px) 14px; box-shadow:0 4px 0 #0002;
  font-size:clamp(17px,1.3vw + 11px,26px); font-weight:800; line-height:1.85; transform-origin:30% 100%; }
.bubble::after{ content:""; position:absolute; left:34%; bottom:-14px; width:22px; height:22px; background:#fff; border-right:3px solid var(--ink); border-bottom:3px solid var(--ink); transform:rotate(45deg); }
.bubble .who{ display:inline-block; font-size:11px; background:var(--main); color:#fff; border-radius:6px; padding:0 7px; line-height:1.8; vertical-align:middle; margin-right:6px; font-weight:800; }
.bubble .spk{ position:absolute; right:8px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; background:var(--main-l); font-size:16px; }
.bubble .tr{ display:block; font-size:clamp(11px,.5vw + 9px,14px); font-weight:500; color:var(--sub); line-height:1.4; }
.bubble.pop{ animation:bub .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes bub{ from{ transform:scale(.6); opacity:0; } }
.lvl{ position:absolute; left:2%; bottom:3%; z-index:3; background:#1d2730d9; color:#fff; border-radius:12px; padding:5px 10px; font-size:12px; font-weight:800; line-height:1.3; }
.lvl .stars{ color:var(--gold); letter-spacing:1px; font-size:14px; }
.lvl .nm{ display:block; font-size:clamp(12px,.6vw + 9px,15px); }
.lvl.up{ animation:lvup .8s; }
@keyframes lvup{ 30%{ transform:scale(1.25); background:var(--accent); } }
#combo{ position:absolute; left:3%; top:34%; z-index:3; text-align:center; pointer-events:none; opacity:0; transform:scale(.5); transition:opacity .25s, transform .25s; }
#combo.on{ opacity:1; transform:scale(1); }
#combo .n{ display:block; font-size:clamp(40px,4vw + 22px,76px); font-weight:900; line-height:.9; font-style:italic;
  color:#fff; -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:0 4px 0 var(--ink); }
#combo .t{ display:inline-block; font-size:clamp(12px,.6vw + 10px,17px); font-weight:900; color:#fff; background:var(--ink); border-radius:8px; padding:1px 8px; letter-spacing:.12em; margin-top:4px; }
#combo.t2 .n{ color:var(--gold); }
#combo.t3 .n{ color:#ff7b54; }
#combo.t4 .n{ color:#ff5fa2; animation:hue 1.2s linear infinite; }
#combo.t4 .t{ background:linear-gradient(90deg,#ff5f6d,#c86dd7); }
@keyframes hue{ to{ filter:hue-rotate(360deg); } }
#combo.bump .n{ animation:bump .45s cubic-bezier(.3,1.8,.5,1); }
@keyframes bump{ 0%{ transform:scale(1.9) rotate(-8deg); } 100%{ transform:scale(1); } }
#combo.brk{ opacity:1; transform:scale(1); }
#combo.brk .n{ color:#9aa3ab; animation:fall .7s forwards; }
@keyframes fall{ to{ transform:translateY(40px) rotate(18deg); opacity:0; } }
#stamp{ position:absolute; left:50%; top:52%; z-index:4; width:min(38vmin,190px); height:min(38vmin,190px); margin:calc(min(38vmin,190px) / -2) 0 0 calc(min(38vmin,190px) / -2);
  pointer-events:none; opacity:0; }
#stamp.show{ animation:stamp .9s ease-out forwards; }
@keyframes stamp{ 0%{ opacity:0; transform:scale(2.4) rotate(-20deg);} 25%{ opacity:1; transform:scale(.92) rotate(0);} 35%{ transform:scale(1.05);} 75%{ opacity:1;} 100%{ opacity:0; transform:scale(1);} }
.toast{ position:absolute; left:50%; top:36%; transform:translateX(-50%); z-index:4; background:var(--accent); color:#fff; font-weight:900; border-radius:999px; padding:8px 18px;
  font-size:clamp(14px,.8vw + 10px,19px); white-space:nowrap; box-shadow:0 4px 0 var(--accent-d); pointer-events:none; animation:toast 2.2s forwards; text-align:center; line-height:1.4; }
.toast small{ display:block; font-size:.72em; font-weight:700; }
@keyframes toast{ 0%{ opacity:0; transform:translate(-50%,20px) scale(.7);} 12%{ opacity:1; transform:translate(-50%,0) scale(1.08);} 20%{ transform:translate(-50%,0) scale(1);} 85%{ opacity:1;} 100%{ opacity:0; transform:translate(-50%,-20px);} }
#scene.shake{ animation:shake .45s; }
@keyframes shake{ 20%{ transform:translateX(-8px);} 40%{ transform:translateX(8px);} 60%{ transform:translateX(-5px);} 80%{ transform:translateX(4px);} }
#flash{ position:absolute; inset:0; z-index:4; pointer-events:none; opacity:0; background:#fff; }
#flash.go{ animation:flash .5s; }
@keyframes flash{ 0%{ opacity:.85; } 100%{ opacity:0; } }

/* SVG 内のアニメーション */
.stage *{ transition:opacity .9s, fill .9s; }
.lamp{ fill:#cfd5da; } .lamp.on{ fill:#fffbea; filter:url(#glow); }
.prod{ opacity:0; transform-box:fill-box; transform-origin:50% 100%; }
.prod.on{ opacity:1; animation:prodIn .5s cubic-bezier(.3,1.7,.5,1) backwards; }
@keyframes prodIn{ from{ transform:scaleY(0); } }
.walker{ opacity:0; transition:opacity 1s; }
.walker.on{ opacity:1; }
.walker.on > g{ animation:bob 1.6s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-4px); } }
.popsign{ opacity:0; } .popsign.on{ opacity:1; }
.spark{ opacity:0; transform-box:fill-box; transform-origin:center; }
.spark.on{ animation:twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle{ 0%,100%{ opacity:0; transform:scale(.3);} 50%{ opacity:1; transform:scale(1);} }
.face{ display:none; } .face.on{ display:inline; }
#clerk.happy > g{ animation:hop .5s; }
@keyframes hop{ 40%{ transform:translateY(-10px); } }
.prop-in{ animation:propIn .45s cubic-bezier(.3,1.6,.5,1); transform-box:fill-box; transform-origin:50% 100%; }
@keyframes propIn{ from{ transform:translateY(-30px) scale(.6); opacity:0; } }
.react{ font-size:30px; }

/* ====== パネル ====== */
#panel{ position:static; display:flex; flex-direction:column; gap:clamp(6px,1.2vh,12px); padding:clamp(10px,1.6vh,18px) clamp(12px,2vw,20px) 14px; overflow-y:auto; background:var(--bg); }
.timer{ height:6px; background:#0000000f; border-radius:99px; overflow:hidden; flex:none; }
.timer i{ display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--accent)); transform-origin:left; border-radius:99px; }
.qhead{ display:flex; align-items:center; gap:8px; }
.qno{ background:var(--ink); color:#fff; font-weight:900; border-radius:8px; padding:2px 10px; font-size:14px; flex:none; }
.qtext{ font-size:clamp(16px,.8vw + 12px,21px); font-weight:800; line-height:1.85; }
.qtext .tr{ display:block; font-size:12px; color:var(--sub); font-weight:500; line-height:1.4; }
.custline{ background:#fff4e8; border:2px dashed var(--accent); border-radius:12px; padding:4px 12px; font-weight:800; font-size:clamp(16px,.8vw + 12px,20px); line-height:1.9; }
.custline .who{ font-size:11px; background:var(--accent); color:#fff; border-radius:6px; padding:0 6px; margin-right:6px; vertical-align:middle; }
.choices{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(8px,1.2vh,12px); }
@media (max-width:520px){ .choices{ grid-template-columns:1fr; } }
.ch{ position:relative; display:flex; align-items:center; gap:10px; text-align:left; background:var(--card); border:3px solid var(--line); border-bottom-width:6px;
  border-radius:16px; padding:8px 12px; min-height:clamp(52px,7vh,72px); font-size:clamp(16px,.9vw + 12px,21px); font-weight:800; line-height:1.7;
  transition:transform .08s, border-color .2s, background .2s; }
.ch:hover:not(:disabled){ border-color:#b9c3cb; transform:translateY(-2px); }
.ch:active:not(:disabled){ transform:translateY(3px); border-bottom-width:3px; }
.ch .k{ flex:none; width:clamp(30px,3.4vh,38px); height:clamp(30px,3.4vh,38px); border-radius:10px; display:grid; place-items:center; color:#fff; font-weight:900; font-size:clamp(15px,1.8vh,19px); }
.ch:nth-child(1) .k{ background:var(--A); } .ch:nth-child(2) .k{ background:var(--B); }
.ch:nth-child(3) .k{ background:var(--C); } .ch:nth-child(4) .k{ background:var(--D); }
.ch:disabled{ cursor:default; }
.ch.dim{ opacity:.45; }
.ch.ok{ border-color:var(--ok); background:#e2f7ee; animation:okp .5s; }
.ch.ok::after{ content:"◯"; position:absolute; right:10px; color:var(--ok); font-weight:900; font-size:1.4em; }
.ch.ng{ border-color:var(--ng); background:#fde8e8; animation:ngp .4s; }
.ch.ng::after{ content:"✕"; position:absolute; right:12px; color:var(--ng); font-weight:900; font-size:1.3em; }
@keyframes okp{ 40%{ transform:scale(1.05); } }
@keyframes ngp{ 25%{ transform:translateX(-6px);} 75%{ transform:translateX(6px);} }

/* フィードバック */
.fb{ position:absolute; left:8px; right:8px; bottom:8px; z-index:6; max-height:min(78%, calc(100% - 70px)); overflow-y:auto; max-width:744px; margin:0 auto;
  background:var(--card); border-radius:20px; box-shadow:0 -6px 30px #0003; border:3px solid var(--ok);
  padding:14px 16px 16px; transform:translateY(110%); transition:transform .4s cubic-bezier(.2,1.2,.4,1); }
.fb.on{ transform:translateY(0); }
.fb.ng{ border-color:var(--ng); }
.fb .ttl{ display:flex; align-items:center; gap:10px; font-size:clamp(20px,1vw + 15px,26px); font-weight:900; color:var(--ok); }
.fb.ng .ttl{ color:var(--ng); }
.fb .ttl small{ font-size:13px; color:var(--sub); font-weight:700; }
.fb .ans{ margin-top:6px; font-size:clamp(15px,.6vw + 12px,18px); font-weight:800; line-height:1.8; }
.fb .ans .k{ display:inline-grid; place-items:center; width:26px; height:26px; border-radius:8px; color:#fff; margin-right:6px; font-size:14px; vertical-align:middle; }
.fb .exp{ margin-top:8px; background:var(--main-l); border-radius:12px; padding:10px 12px; font-size:clamp(14px,.5vw + 12px,17px); line-height:2; }
.fb .exp b{ color:var(--main-d); }
.fb .note{ display:block; margin-top:4px; color:var(--accent-d); font-weight:700; }
.fb .tr{ margin-top:8px; font-size:14px; line-height:1.6; display:flex; gap:8px; align-items:flex-start; }
.fb .tr .flag{ flex:none; }
.fb .row{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; position:sticky; bottom:-16px; background:var(--card); padding:8px 0 14px; margin-bottom:-14px; }
.sbtn{ background:var(--main-l); color:var(--main-d); border-radius:12px; padding:8px 12px; font-weight:800; font-size:14px; }
.next{ margin-left:auto; background:var(--accent); color:#fff; border-radius:14px; padding:10px 22px; font-weight:900; font-size:clamp(16px,.6vw + 13px,19px); box-shadow:0 4px 0 var(--accent-d); }
.next:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--accent-d); }
.next small{ font-size:11px; display:block; font-weight:700; opacity:.9; }

/* ====== オーバーレイ（スタート・結果） ====== */
.ov{ position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:16px; background:#14202acc; backdrop-filter:blur(3px); }
.ov.on{ display:flex; }
.sheet{ width:100%; max-width:520px; max-height:100%; overflow-y:auto; background:var(--card); border-radius:24px; padding:22px 20px; text-align:center; box-shadow:0 20px 60px #0007; }
.sheet h1{ font-size:clamp(22px,2vw + 14px,32px); line-height:1.4; }
.sheet .sub{ color:var(--sub); font-weight:700; margin-top:4px; font-size:14px; }
.shopsign{ display:inline-block; background:var(--main); color:#fff; font-weight:900; font-size:clamp(18px,1.5vw + 12px,26px); padding:6px 18px; border-radius:12px; letter-spacing:.06em; }
.awn{ height:10px; width:70%; margin:0 auto 12px; border-radius:0 0 8px 8px; background:repeating-linear-gradient(90deg,var(--accent) 0 14px,#fff 14px 28px); border:2px solid var(--main); border-top:none; }
.lbl{ font-size:12px; color:var(--sub); font-weight:800; margin:16px 0 6px; text-align:left; }
.seg{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.seg button{ border:2px solid var(--line); border-radius:12px; padding:10px 4px; font-weight:800; font-size:15px; }
.seg button[aria-pressed="true"]{ border-color:var(--main); background:var(--main-l); color:var(--main-d); }
.tg{ display:flex; gap:6px; }
.tg button{ flex:1; border:2px solid var(--line); border-radius:12px; padding:9px 4px; font-weight:800; font-size:14px; }
.tg button[aria-pressed="true"]{ border-color:var(--main); background:var(--main-l); color:var(--main-d); }
.big{ display:block; width:100%; margin-top:18px; background:var(--accent); color:#fff; border-radius:16px; padding:15px; font-size:clamp(19px,1vw + 14px,24px); font-weight:900; box-shadow:0 5px 0 var(--accent-d); }
.big small{ display:block; font-size:12px; opacity:.9; }
.big:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--accent-d); }
.big.sec{ background:var(--main); box-shadow:0 5px 0 var(--main-d); }
.how{ text-align:left; background:var(--bg); border-radius:14px; padding:10px 12px; font-size:13.5px; line-height:1.8; margin-top:14px; }
.how b{ color:var(--accent-d); }
.res-score{ font-size:clamp(40px,4vw + 24px,60px); font-weight:900; color:var(--accent); line-height:1.1; margin-top:6px; font-variant-numeric:tabular-nums; }
.res-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
.res-grid div{ background:var(--bg); border-radius:12px; padding:8px 4px; font-size:12px; color:var(--sub); font-weight:700; }
.res-grid b{ display:block; font-size:22px; color:var(--ink); }
.res-msg{ margin-top:12px; font-size:clamp(16px,.6vw + 13px,19px); font-weight:800; line-height:1.8; }
.res-msg .tr{ display:block; font-size:13px; color:var(--sub); font-weight:600; line-height:1.5; }
.miss{ text-align:left; margin-top:10px; display:flex; flex-direction:column; gap:6px; }
.miss div{ background:#fff4f2; border-left:5px solid var(--ng); border-radius:10px; padding:6px 10px; font-size:14px; line-height:1.8; }
.miss small{ color:var(--sub); }
.seg.two{ grid-template-columns:1fr 1fr; }
.hbtn.lang{ width:auto; min-width:40px; padding:0 8px; font-size:13px; white-space:nowrap; font-weight:900; background:#fff; color:var(--main-d); }
.hbtn.quit{ background:#ffffff; color:var(--ng); font-size:16px; font-weight:900; }
.qbtns{ display:grid; gap:10px; margin-top:16px; }
.qbtns .big{ margin-top:0; font-size:18px; }
.big.sec2{ background:#fff; color:var(--ink); border:2px solid var(--line); box-shadow:0 4px 0 var(--line); }
#ovBye{ z-index:40; background:#14202af2; }
@media (max-width:430px){ .brand{ display:none; } .dots{ margin-left:0; } .dots{ gap:3px; } header{ gap:6px; padding:8px; } .hbtn{ width:32px; height:32px; } }
@media (max-width:350px){ .dots i{ width:6px; height:6px; } .score{ min-width:48px; } }
.sheet.small{ max-width:420px; }
.sheet h2{ font-size:clamp(19px,1vw + 14px,24px); line-height:1.6; }
.sheet h2 small{ font-size:13px; color:var(--sub); font-weight:700; }
.vol{ display:grid; grid-template-columns:32px 92px 1fr 36px; align-items:center; gap:8px; margin-top:14px; text-align:left; }
.vol .vi{ font-size:22px; }
.vol .vl{ font-weight:800; font-size:15px; line-height:1.5; }
.vol .vl small{ display:block; font-size:11px; color:var(--sub); font-weight:600; }
.vol output{ font-weight:900; font-variant-numeric:tabular-nums; text-align:right; color:var(--main-d); }
.vol input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:10px; border-radius:99px; background:var(--main-l); outline:none; }
.vol input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:var(--main); border:4px solid #fff; box-shadow:0 2px 6px #0004; cursor:pointer; }
.vol input[type=range]::-moz-range-thumb{ width:24px; height:24px; border-radius:50%; background:var(--main); border:4px solid #fff; box-shadow:0 2px 6px #0004; cursor:pointer; }
.qicon{ font-size:44px; }
.btns2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btns2 .big{ margin-top:14px; font-size:18px; }
.big.danger{ background:var(--ng); box-shadow:0 5px 0 #c03a37; }
/* 完全版教材の案内 */
#ovPromo{ z-index:30; }
.promo{ max-width:440px; text-align:left; position:relative; border:3px solid var(--ok); }
.promo .x{ position:absolute; right:10px; top:10px; width:34px; height:34px; border-radius:50%; background:var(--bg); font-size:16px; font-weight:900; }
.promo .gc{ text-align:center; font-size:clamp(22px,1.4vw + 16px,28px); font-weight:900; color:var(--ok); letter-spacing:.04em; }
.promo .hi{ font-size:17px; font-weight:900; margin-top:10px; line-height:1.8; }
.promo .lead{ font-size:15px; font-weight:700; line-height:1.9; margin-top:2px; }
.promo .tr{ display:block; font-size:12px; color:var(--sub); font-weight:600; line-height:1.5; }
.promo .pack{ background:var(--bg); border-radius:14px; padding:12px 14px; margin-top:12px; }
.promo .pack h3{ font-size:16px; line-height:1.8; display:flex; align-items:center; gap:6px; }
.promo .pack ul{ margin:4px 0 0 20px; }
.promo .pack li{ font-size:14.5px; font-weight:700; line-height:1.8; margin-bottom:2px; }

function wavURL(samples, rate){
  const n = samples.length, buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);

  str(0,"RIFF"); v.setUint32(4, 36 + n*2, true); str(8,"WAVE"); str(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); str(36,"data"); v.setUint32(40,n*2,true);
  for (let i = 0; i < n; i++){ const x = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i*2, x * 32767, true); }
  return URL.createObjectURL(new Blob([buf], { type:"audio/wav" }));
}

function tone(seq, type="sine", vol=.12){
  if (!S.snd) return; const c = ac(); if (!c) return;
  let t = c.currentTime + .01;
  seq.forEach(([f,d,gap]) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g).connect(seBus); o.start(t); o.stop(t+d+.02); t += (gap ?? d);

}

/* ---------- BGM（オリジナル曲を合成：明るいコンビニ風・8小節ループ） ---------- */
const BGM = (() => {
  const BPM = 118, E = 60 / BPM / 2, STEPS = 64;   // 8分音符 × 8小節
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const MEL = [
    [76,null,79,null,81,79,76,null],[72,null,76,null,74,72,69,null],
    [72,74,76,null,77,76,74,null],[74,null,71,null,74,76,79,null],
    [76,null,79,null,84,83,81,79],[81,null,76,null,74,72,76,null],
    [77,null,76,74,72,null,74,76],[79,null,77,null,74,null,71,null],
  ];
  const CH = [[60,64,67],[57,60,64],[57,60,65],[55,59,62],[60,64,67],[57,60,64],[57,60,65],[55,59,62]];
  const BASS = [48,45,41,43,48,45,41,43];
  const noiseOf = new WeakMap();
  function note(ctx, dest, f, t, d, type, vol, cut){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    if (cut){ const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = cut; o.connect(lp).connect(g); } else o.connect(g);
    g.connect(dest); o.start(t); o.stop(t + d + .03);
  }
  function hat(ctx, dest, t){
    let nb = noiseOf.get(ctx);
    if (!nb){ nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * .05), ctx.sampleRate); const d = nb.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; noiseOf.set(ctx, nb); }

    g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + .04);
    s.connect(hp).connect(g).connect(dest); s.start(t);
  }
  function step(ctx, dest, n, t){
    const bar = Math.floor(n / 8) % 8, e = n % 8;
    const m = MEL[bar][e]; if (m) note(ctx, dest, mf(m), t, E * 1.6, "triangle", .16, 3200);
    if (e % 4 === 0) note(ctx, dest, mf(BASS[bar]), t, E * 1.8, "triangle", .32);
    if (e % 4 === 2) note(ctx, dest, mf(BASS[bar] + 7), t, E * 1.4, "triangle", .2);
    if (e % 2 === 1){ CH[bar].forEach(c => note(ctx, dest, mf(c), t, E * .8, "square", .025, 1600)); hat(ctx, dest, t); }
  }
  /* PC / Android：その場で鳴らす */
  let timer = null, next = 0, n = 0, on = false;
  function schedule(){
    if (next < AC.currentTime) next = AC.currentTime + .05;
    while (next < AC.currentTime + .15){ step(AC, bgmBus, n, next); next += E; n++; }
  }
  /* iPhone：1周分を WAV に書き出して <audio loop> で鳴らす */
  let url = null, renderedVol = -1, rendering = null;
  async function render(){
    const vol = S.vol.bgm * BGM_MAX;
    if (url && renderedVol === vol) return url;
    const rate = 22050, len = Math.ceil(STEPS * E * rate);
    const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const oc = new OC(1, len, rate), g = oc.createGain(); g.gain.value = vol; g.connect(oc.destination);

    if (!S.snd || S.vol.bgm <= 0) return;
    try{
      const u = await (rendering = render());
      if (!on) return;
      if (bEl.src !== u){ bEl.src = u; }
      bEl.loop = true; await bEl.play();
    }catch(e){}
  }
  return {
    start(){
      if (on) return; on = true;
      if (IOS){ playIOS(); return; }
      const c = ac(); if (!c) return; next = c.currentTime + .1; n = 0; timer = setInterval(schedule, 30);
    },
    stop(){ on = false; clearInterval(timer); timer = null; try{ bEl.pause(); }catch(e){} },
    refresh(){ if (IOS && on) playIOS(); },          // 音量を変えたとき（iPhone は書き出し直す）

    get on(){ return on; },
  };
})();

/* ファイルがあるか調べて URL を返す（mp3 → wav の順） */
function findURL(key){
  if (!voiceU[key]) voiceU[key] = (async () => {
    for (const ext of [".mp3", ".wav"]){
      try{
        const r = await fetch(VOICE_DIR + key + ext, { method:"HEAD" });
        if (r.ok && !(r.headers.get("content-type") || "").includes("text/html")) return VOICE_DIR + key + ext;
        voiceMiss[key+ext] = 1;
      }catch(e){ voiceMiss[key+ext] = 1; }
    }

  })();
  return voiceU[key];
}
/* ファイルの中身を先に取ってくる（音の準備がなくてもできる） */
const voiceB = {};
function fetchBytes(key){
  if (!voiceB[key]) voiceB[key] = (async () => {
    const u = await findURL(key); if (!u) return null;
    try{ const r = await fetch(u); return r.ok ? await r.arrayBuffer() : null; }catch(e){ return null; }
  })();
  return voiceB[key];

  if (!voiceP[key]) voiceP[key] = (async () => {

    try{ return await decode(ab.slice(0)); }catch(e){ return null; }
  })();
  return voiceP[key];

/* 読み込みの順番：「いらっしゃいませ」→ 第1問 → 残り（少しずつ）

let preloading = null;
function preloadVoices(){
  if (LOCAL || preloading) return preloading;
  const first = ["welcome", QUIZ[0].id+"_clerk", QUIZ[0].id+"_answer"];
  const rest = QUIZ.slice(1).flatMap(q => [q.id+"_clerk", q.id+"_answer"]).concat(["end","react_ok","react_ng"]);
  const load = IOS ? findURL : (k => fetchBytes(k).then(() => ac() && loadBuf(k)));
  preloading = (async () => {
    for (const k of first) await load(k);
    for (let i = 0; i < rest.length; i += 3) await Promise.all(rest.slice(i, i + 3).map(load));

/* ページを開いた時点で「いらっしゃいませ」と第1問の音声を取りにいく */
if (!LOCAL){ (IOS ? findURL : fetchBytes)("welcome"); (IOS ? findURL : fetchBytes)(QUIZ[0].id+"_clerk"); }
function tryFile(key, ext){
  return new Promise(res => {
    if (voiceMiss[key+ext]) return res(null);
    const a = new Audio(VOICE_DIR + key + ext);
    const fail = () => { voiceMiss[key+ext] = 1; res(null); };
    a.addEventListener("canplaythrough", () => res(a), { once:true });
    a.addEventListener("error", fail, { once:true });

      if (my !== voiceSeq) return;
      if (buf){
        const s = AC.createBufferSource(); s.buffer = buf; s.connect(voiceBus);
        s.onended = () => { if (curSrc === s){ curSrc = null; duck(false); finishVoice(); } };
        curSrc = s; duck(true); s.start(); return;
      }
    }
    if (my !== voiceSeq) return;
    if (useTTS && text) tts(text); else finishVoice();
  })();
  return done;
}

    const a = Math.random()*Math.PI*2, v = (2 + Math.random()*6) * power;
    parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 3*power, g:.22, life:1, decay:.018 + Math.random()*.016,
      c:colors[Math.random()*colors.length|0], s:4 + Math.random()*6, r:Math.random()*6, vr:(Math.random()-.5)*.3, sh:shape || (Math.random()<.5 ? "rect" : "star") });

  for (let i=0;i<n;i++) parts.push({ x:Math.random()*innerWidth, y:-20 - Math.random()*innerHeight*.5, vx:(Math.random()-.5)*2, vy:2+Math.random()*3, g:.05,

$("quitNo").onclick = () => $("ovQuit").classList.remove("on");
$("quitHome").onclick = () => { $("ovQuit").classList.remove("on"); quitGame(); };
$("quitYes").onclick = () => { $("ovQuit").classList.remove("on"); closeGame(); };
/* ゲームを完全に終了：音・演出・予約処理をすべて止めて、タブを閉じる */
function closeGame(){
  GEN++; if (G) G.over = true;
  stopVoice(); BGM.stop();
  try{ AC && AC.suspend(); }catch(e){}
  try{ vEl.pause(); bEl.pause(); }catch(e){}
  parts = [];
  ["ovStart","ovEnd","ovSet","ovQuit","ovPromo"].forEach(id => $(id).classList.remove("on"));
  $("fb").classList.remove("on"); $("combo").className = "";
  document.body.classList.remove("playing");
  const L = LANG_ATTR[S.lang];
  $("byeH").innerHTML = rb("ご{利用|りよう}ありがとうございました！");
  $("byeTr").innerHTML = `<span ${L}>${T("bye")}</span>`;
  $("byeHint").innerHTML = `${rb("このタブ（ウィンドウ）を{閉|と}じてください。")}<br><span ${L}>${T("byeHint")}</span>`;
  $("byeAgain").innerHTML = `${rb("もう{一度|いちど}あそぶ")}<small ${L}>${T("playAgain")}</small>`;
  $("ovBye").classList.add("on");
  try{ window.close(); }catch(e){}
  // ブラウザが閉じるのを許可しなかったときは案内を出す
  setTimeout(() => { $("byeHint").style.display = ""; }, 400);
}
$("byeAgain").onclick = () => { location.href = location.pathname; };
function quitGame(){
  GEN++; stopVoice(); G.over = true;
  $("fb").classList.remove("on"); $("combo").className = ""; $("stamp").classList.remove("show");
  $("timer").style.transition = "none"; $("timer").style.transform = "scaleX(1)";
  $("choices").innerHTML = ""; $("qtext").innerHTML = ""; $("qno").textContent = ""; $("custLine").innerHTML = "";
  $("dots").innerHTML = ""; $("score").textContent = "0";
  face("cf","normal"); face("uf","normal");
  $("bubble").innerHTML = `<span class="who">店員</span>${rb("またお{越|こ}しください！")}`;
  document.body.classList.remove("playing");
  $("ovStart").classList.add("on");
}
/* BGM は最初から ON：ブラウザの制限で、最初のタップ（クリック・キー入力）と同時に鳴り始める */
let firstTap = true;
function unlockAudio(){
  unlockIOS(); unlockTTS();
  if (firstTap){ firstTap = false; if (S.snd && S.vol.bgm > 0 && !$("ovBye").classList.contains("on")) BGM.start(); }
}
["touchend","click","keydown"].forEach(ev => addEventListener(ev, unlockAudio, { capture:true }));
$("go").onclick = () => { unlockIOS(); unlockTTS(); preloadVoices(); BGM.start(); $("ovStart").classList.remove("on"); newGame(QUIZ.map((_,i)=>i)); };
$("again").onclick = () => { $("ovEnd").classList.remove("on"); $("ovPromo").classList.remove("on"); newGame(QUIZ.map((_,i)=>i)); };

/* キーボード操作（PC）：1〜4 / A〜D で選択、Enter で次へ */
addEventListener("keydown", e => {
  if ($("ovBye").classList.contains("on")) return;
  if ($("ovPromo").classList.contains("on")){ if (e.key === "Escape") $("ovPromo").classList.remove("on"); return; }
  if ($("ovQuit").classList.contains("on")){ if (e.key === "Escape") $("quitNo").click(); return; }
  if ($("ovSet").classList.contains("on")){ if (e.key === "Escape" || e.key === "Enter") $("setClose").click(); return; }
  if ($("ovStart").classList.contains("on")){ if (e.key === "Enter") $("go").click(); return; }
  if (e.key === "Escape"){ $("bQuit").click(); return; }
  if ($("ovEnd").classList.contains("on")) return;
  const fbOn = $("fb").classList.contains("on");
  if (fbOn && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); $("nx")?.click(); return; }
  const k = { "1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3 }[e.key.toLowerCase()];
  if (k !== undefined && !fbOn){ const b = $("choices").children[k]; b && !b.disabled && b.click(); }
});

buildStage();
applyLevel(1);
setProp(QUIZ[0]);
$("bubble").innerHTML = `<span class="who">店員</span>いらっしゃいませ！`;
applyOpts();

/* 確認用の自動プレイ（URL の末尾に #shot=cccf などを付けたときだけ動く）
   c=正解 / w=不正解 / 最後に f を付けると解説を開いたまま止まる */
(function(){
  const m = location.hash.match(/^#shot=([cwf]+)/); if (!m) return;
  S.snd = false; const plan = m[1].replace("f",""), stopFb = m[1].endsWith("f");
  $("go").click(); let i = 0;
  const step = () => {
    if (i >= plan.length) return;
    if (!$("choices").children.length || G.busy) return setTimeout(step, 200);   // 問題が出るまで待つ
    const q = QUIZ[G.order[G.i]], ch = plan[i++];
    $("choices").children[ch === "c" ? q.a : (q.a + 1) % 4].click();
    setTimeout(() => { if (i === plan.length && stopFb) return; next(); setTimeout(step, 900); }, 1600);
  };
  setTimeout(step, 1300);
})();
</script>
